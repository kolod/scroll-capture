# Builds with warnings as errors and runs the tests on every pull request and push to main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build (Release, warnings as errors)
        shell: pwsh
        run: dotnet build ScrollCapture.sln -c Release -warnaserror "-p:Version=0.0.0-ci.${{ github.run_number }}"

      - name: Test
        shell: pwsh
        run: dotnet test tests/ScrollCapture.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory "${{ runner.temp }}/test-results"

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrollcapture-exe
          path: |
            src/ScrollCapture.App/bin/Release/net48/ScrollCapture.exe
            src/ScrollCapture.App/bin/Release/net48/ScrollCapture.exe.config
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results/results.trx
          if-no-files-found: warn
          retention-days: 14
